<main>
    <h1>Signup</h1>

    <button id="themeToggle">Toggle Theme</button>

    <form id="signupForm">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
        >

        <label for="phone">Phone</label>
        <input
            type="tel"
            id="phone"
            name="phone"
        >

        <button type="submit">Sign Up</button>

        <p id="error"></p>

    </form>

    <p id="count"></p>
</main>
