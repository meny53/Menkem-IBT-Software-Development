<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 40px;
            background-color: #333;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right a {
            color: white;
            text-decoration: none;
        }

        .nav-right button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            MyLogo
        </div>

        <div class="nav-right">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>

            <button>Sign Up</button>
        </div>

    </nav>

</body>
</html>
