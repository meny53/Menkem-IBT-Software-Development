<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Cards</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;

            padding: 30px;
        }

        .card {
            flex: 1;
            min-width: 200px;

            padding: 30px;

            background-color: lightblue;

            border-radius: 10px;

            text-align: center;
        }
    </style>
</head>

<body>

    <div class="cards">

        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
        </div>

        <div class="card">
            <h2>Card 4</h2>
            <p>This is the fourth card.</p>
        </div>

    </div>

</body>
</html>
