<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile Card</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        /* Global box-sizing */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        /* CSS Variables */
        :root {
            --primary-color: hsl(120, 70%, 30%);
            --secondary-color: hsl(45, 100%, 55%);
            --background-color: hsl(0, 0%, 96%);
            --text-color: hsl(0, 0%, 20%);

            --space-small: 10px;
            --space-medium: 20px;
            --space-large: 40px;

            --font-family: "Poppins", sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--background-color);
            font-family: var(--font-family);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {
            width: 350px;
            background: white;

            padding: var(--space-medium);

            border: 2px solid var(--primary-color);

            border-radius: 12px;

            margin: var(--space-large);

            box-shadow: 0 4px 10px rgba(0,0,0,0.15);

            position: relative;
        }

        /* Decorative pseudo-element */
        .card::before {
            content: "";
            display: block;

            width: 100%;
            height: 8px;

            background: var(--secondary-color);

            border-radius: 10px 10px 0 0;

            position: absolute;
            top: 0;
            left: 0;
        }

        h1 {
            margin-top: 20px;
            margin-bottom: var(--space-small);

            color: var(--primary-color);

            font-size: 2rem;
        }

        .tagline {
            color: gray;
            font-style: italic;

            margin-bottom: var(--space-medium);
        }

        p {
            color: var(--text-color);
            line-height: 1.8;
            margin-bottom: var(--space-medium);
        }

        button {
            background: hsl(120, 70%, 30%);
            color: white;

            border: none;

            padding: var(--space-small) var(--space-medium);

            border-radius: 6px;

            font-size: 1rem;

            cursor: pointer;
        }

        /* Hover changes ONLY lightness */
        button:hover {
            background: hsl(120, 70%, 45%);
        }

    </style>

</head>

<body>

    <div class="card">

        <h1>Bole Coffee House</h1>

        <p class="tagline">
            Fresh Coffee • Free Wi-Fi • TeleBirr Accepted
        </p>

        <p>
            Bole Coffee House is a fictional café located in Addis Ababa,
            serving freshly brewed Ethiopian coffee, traditional snacks,
            and comfortable seating for friends, students, and business
            meetings.
        </p>

        <button>Contact</button>

    </div>

</body>
</html>
