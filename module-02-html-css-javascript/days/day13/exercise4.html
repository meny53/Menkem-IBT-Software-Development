<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 4 - Ethiopian Airlines Table</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            width: 80%;
        }

        th {
            background-color: darkgreen;
            color: white;
        }

        th,
        td {
            border: 1px solid black;
            padding: 12px;
            text-align: left;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

    </style>

</head>

<body>

    <h2>Ethiopian Airlines Flight Schedule</h2>

    <table>

        <thead>

            <tr>
                <th>Flight</th>
                <th>From</th>
                <th>To</th>
                <th>Departs</th>
                <th>Price (ETB)</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td>ET101</td>
                <td>Addis Ababa</td>
                <td>Hawassa</td>
                <td>08:00</td>
                <td>4,500</td>
            </tr>

            <tr>
                <td>ET202</td>
                <td>Addis Ababa</td>
                <td>Bahir Dar</td>
                <td>09:30</td>
                <td>5,200</td>
            </tr>

            <tr>
                <td>ET303</td>
                <td>Addis Ababa</td>
                <td>Mekelle</td>
                <td>11:15</td>
                <td>6,000</td>
            </tr>

            <tr>
                <td>ET404</td>
                <td>Addis Ababa</td>
                <td>Dire Dawa</td>

            <tr>

                <td>Addis Ababa</td>
                <td>Gondar</td>
                <td>17:45</td>
                <td>5,800</td>
            </tr>

        </tbody>

    </table>

</body>
</html>
