<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>

</head>
<body>

    <h1>Currency Converter</h1>

    <!-- Status message -->
    <p id="status"></p>

    <!-- Convert form -->
    <form id="convertForm">
        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="0"
            step="any"
        >

        <label for="currency">Currency:</label>

<select id="currency">
</select>
        

        <button type="submit">Convert</button>
    </form>

    <!-- Conversion result -->
    <p id="result"></p>

    <h2>Watchlist</h2>

    <!-- Watchlist -->
    <ul id="watchlist">
        <!-- Watchlist items will be added by JavaScript later -->
    </ul>

    <script src="app.js"></script>
</body>
</html>
