<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch</title>
</head>
<body>

    <h1>Birr Watch</h1>

    <p id="status">Loading rates...</p>

    <form id="convertForm">

        <label for="amount">Amount:</label>
        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            min="0"
            step="any"
        >

        <label for="currency">Currency:</label>
        <select id="currency"></select>

        <button type="submit">Convert</button>
        <button type="button" id="addButton">Add to Watchlist</button>

    </form>

    <p id="result"></p>

    <h2>Watchlist</h2>

    <ul id="watchlist"></ul>

    <script src="app.js"></script>

</body>
</html>
